[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "karpaty-bot"
version = "0.1.0"
description = "Telegram-интерфейс для персональной базы знаний mozg"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.7,<4",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "openai>=1.30,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]